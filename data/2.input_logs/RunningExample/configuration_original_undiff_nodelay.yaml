version: 5
##########
# Common #
##########
common:
  train_log_path: ./RunningExample.csv.gz
  log_ids:
    case: "caseid"
    activity: "task"
    resource: "user"
    start_time: "start_timestamp"  # Assuming the log contains this
    end_time: "end_timestamp"      # Assuming the log contains this
  discover_data_attributes: true

#################
# Preprocessing #
#################
preprocessing:
  enable_time_concurrency_threshold: 0.0

################
# Control-flow #
################
control_flow:
  optimization_metric: two_gram_distance
  num_iterations: 10
  num_evaluations_per_iteration: 3
  gateway_probabilities: discovery
  mining_algorithm: sm2
  # Number of concurrent relations between events to be captured
  epsilon:
    - 0.05
    - 0.5
  # Threshold for filtering the incoming and outgoing edges
  eta:
    - 0.2
    - 0.7
  # Whether to replace non-trivial OR joins or not
  replace_or_joins:
    - true
    - false
  # Whether to prioritize parallelism over loops or not
  prioritize_parallelism:
    - true
    - false

##################
# Resource model #
##################
# CLAUDE.md 22.21: igual que configuration_original_undifferentiated.yaml (calendario
# compartido para todo el pool, en vez de uno fragmentado por recurso) MAS la seccion
# extraneous_activity_delays removida por completo (mas abajo) -- aisla el efecto de
# las demoras extra descubiertas por Simod, que resultaron identicas bajo
# differentiated y undifferentiated y con una media para "EVENT 7 END" (120.23 min)
# que coincide exactamente con el promedio real del tiempo de ciclo completo --
# sospecha de que se esta reinyectando la duracion de toda la traza como demora
# extra sobre un evento marcador (no una tarea real con recursos).
resource_model:
  optimization_metric: circadian_emd
  num_iterations: 5
  num_evaluations_per_iteration: 3
  discover_prioritization_rules: false
  discover_batching_rules: false
  resource_profiles:
    discovery_type: undifferentiated
    granularity: 60
    confidence:
      - 0.6
      - 0.7
    support:
      - 0.05
      - 0.5
    participation: 0.4

# Seccion extraneous_activity_delays removida a proposito (sin ella, Simod deberia
# omitir el descubrimiento/inyeccion de demoras extra por completo).
