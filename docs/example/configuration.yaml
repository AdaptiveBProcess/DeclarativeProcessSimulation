version: 5
##########
# Common #
##########
common:
  train_log_path: ./PurchasingExample.csv.gz
  log_ids:
    case: "caseid"
    activity: "task"
    resource: "user"
    start_time: "start_timestamp"  # Assuming the log contains this
    end_time: "end_timestamp"      # Assuming the log contains this
  discover_data_attributes: true

#################
# Preprocessing #
#################
preprocessing:
  enable_time_concurrency_threshold: 0.0

################
# Control-flow #
################
control_flow:
  optimization_metric: two_gram_distance
  num_iterations: 10
  num_evaluations_per_iteration: 3
  gateway_probabilities: discovery
  mining_algorithm: sm2
  # Number of concurrent relations between events to be captured
  epsilon:
    - 0.05
    - 0.5
  # Threshold for filtering the incoming and outgoing edges
  eta:
    - 0.2
    - 0.7
  # Whether to replace non-trivial OR joins or not
  replace_or_joins:
    - true
    - false
  # Whether to prioritize parallelism over loops or not
  prioritize_parallelism:
    - true
    - false

##################
# Resource model #
##################
# discovery_type: undifferentiated (not differentiated) -- a single shared calendar for
# the whole resource pool instead of one fragmented calendar per individual resource.
# With `differentiated`, resource calendars come out fragmented into ~1h blocks (median
# ~16h/week out of 40 possible), which inflates simulated cycle time by roughly 18x
# relative to the real log. See CLAUDE.md 22.19-22.21 for the full root-cause analysis
# (RunningExample: simulated PCE 0.97% with `differentiated` vs ~100% with the real log).
resource_model:
  optimization_metric: circadian_emd
  num_iterations: 5
  num_evaluations_per_iteration: 3
  discover_prioritization_rules: false
  discover_batching_rules: false
  resource_profiles:
    discovery_type: undifferentiated
    granularity: 60
    confidence:
      - 0.6
      - 0.7
    support:
      - 0.05
      - 0.5
    participation: 0.4

# `extraneous_activity_delays` intentionally omitted -- without it, Simod skips
# discovering/injecting extraneous delays. Keeping it enabled was found to reinject the
# full trace duration as an "extra delay" on a synthetic marker event with no real
# resource assigned (e.g. an end-of-process marker), roughly doubling simulated cycle
# time on top of the `differentiated` calendar issue above. See CLAUDE.md 22.22.
